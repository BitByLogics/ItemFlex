Settings:
  # Configuration for plugin permissions and cooldowns.
  Permissions:
    # If true, permission nodes will be enforced across the plugin.
    # If false, only server operators (OPs) can use /itemflex reload,
    # and all players will be subject to cooldowns.
    Enabled: true

    # Permission node required to use the /itemflex command.
    Use: "itemflex.use"

    # Permission node that allows a player to bypass the usage cooldown.
    Bypass-Cooldown: "itemflex.cooldownbypass"

    # Permission node required to execute /itemflex reload.
    Reload: "itemflex.reload"

  # Cooldown duration between uses of the /itemflex command.
  # Supports flexible time formats, e.g.:
  #   "1m" = 1 minute
  #   "2h 30m" = 2 hours and 30 minutes
  Use-Cooldown: "1m"

  # Conditions that must be met for the item to be flexed.
  # Available Conditions:
  #  pdc: Item must have the specified key in its PersistentDataContainer.
  #   - Format: "pdc,<key>,<type>,<value>"
  #   - Example: "pdc,itemflex:test,STRING,test"
  Flex-Conditions: []

  # Maximum number of lore lines shown from the %item_lore% placeholder.
  # If the item has more lore lines than this value, the rest will be skipped.
  # Set to 0 to disable lore entirely.
  Lore-Line-Limit: 3

  # Whether to skip empty lines when displaying %item_lore%.
  # A line is considered empty if it contains no visible characters,
  # including lines that only contain color codes or formatting.
  Ignore-Empty-Lore-Lines: true

  # The format of each enchantment line when %item_enchants% is used.
  Enchant-Format: "&6%enchantment_name% &f%enchantment_level%"

  # The flex animation itself (text lines, item movement, particles, sounds, ...)
  # lives in the animations/ folder as one JSON file per animation.
  # Edit them in the web editor with /itemflex editor.

# Settings for the built-in web editor.
Editor:
  # If false, the web server is not started and /itemflex editor is unavailable.
  Enabled: true

  # Port the editor listens on. This must be a free port that is NOT the Minecraft port,
  # and it needs to be reachable (open/forwarded) by the people using the editor.
  # Pterodactyl: create an extra allocation in the panel and use that port here.
  Port: 8765

  # Address to bind to. Keep this at 0.0.0.0 on hosts and panels. Use 127.0.0.1 only to
  # allow local access (e.g. via an SSH tunnel or a reverse proxy on the same machine).
  # Never put your public IP here; use Public-URL for that.
  Bind-Address: "0.0.0.0"

  # Base URL used in the links sent in game, e.g. "http://203.0.113.5:8765" or
  # "https://flex.example.com". Must be an address players can reach from outside.
  # Leave empty to auto-detect the server's public IP (see Detect-Public-IP).
  # The editor speaks plain HTTP, so put it behind a TLS reverse proxy if it is exposed publicly.
  Public-URL: ""

  # When Public-URL is empty, look up the server's public IP once at startup (using
  # api.ipify.org) and use it with the Port above. Set to false to disable the lookup.
  Detect-Public-IP: true

  # Minutes of inactivity before an editor session expires.
  Session-Minutes: 60

  # The editor shows real Minecraft textures, particles and sounds. These belong to Mojang and
  # are not bundled with the plugin: on first start the server downloads the official client
  # (about 41 MB) from Mojang and caches it in plugins/ItemFlex/assets. Sounds are fetched when
  # first played.
  Assets:
    # If false, nothing is downloaded and the editor falls back to simple placeholders
    # (unless the assets were already cached by an earlier run).
    Enabled: true

    # Minecraft version to take the assets from, e.g. "26.3", or "latest" for the newest release.
    Version: "latest"

  # Permission required for /itemflex editor.
  Permission: "itemflex.editor"

  # Permission required to add or change command events in an animation.
  Commands-Permission: "itemflex.editor.commands"

# All plugin messages can be customized below.
# Supports PlaceholderAPI placeholders and Minecraft hex colors (e.g. #A020F0).
Messages:
  # Shown when the player tries to flex an item that does not meet the flex conditions.
  Cannot-Flex: "#FF5555You cannot flex that item!"

  # Shown when a player lacks the required permission.
  No-Permission: "#FF5555You do not have permission to use this."

  # Shown when the player runs /itemflex without holding an item.
  Must-Hold-Item: "#FFA500You must be holding an item to flex it!"

  # Shown when the player runs /itemflex while already flexing an item.
  Flex-Active: "#FFA500You already have an item flex active!"

  # Shown when the player tries to flex while on cooldown.
  # Placeholders:
  #   %time% — Displays the remaining cooldown duration.
  Cooldown-Active: "#FFD700You're still on cooldown! Please wait #FF5555%time%#FFD700 before flexing again."

  # Shown when a non-player (e.g. console) tries to execute a player-only command.
  Player-Only: "#FF4444This command can only be used by players."

  # Shown when the plugin configuration is successfully reloaded.
  Config-Reloaded: "#55FF55✔ Configuration reloaded successfully."

  # Shown when the requested animation does not exist.
  Unknown-Animation: "#FF5555That animation does not exist."

  # Shown when the web editor is disabled or failed to start.
  Editor-Disabled: "#FF5555The web editor is not running."

  # Clickable message sent with the one-time editor link (valid for 5 minutes).
  Editor-Link: "#55FF55Click here to open the ItemFlex editor."

  # Plain copy of the link, in case clicking is not possible.
  # Placeholders:
  #   %url% — The one-time editor link.
  Editor-Link-Raw: "#AAAAAA%url%"

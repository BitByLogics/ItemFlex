<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ItemFlex</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 5l4.2 8.3L28 16l-7.8 2.7L16 27l-4.2-8.3L4 16l7.8-2.7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand" title="ItemFlex">
      <svg class="logo" viewBox="0 0 32 32" aria-label="ItemFlex">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a78bfa"/>
            <stop offset="1" stop-color="#38bdf8"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="9" fill="url(#logoGrad)"/>
        <path d="M16 5l4.2 8.3L28 16l-7.8 2.7L16 27l-4.2-8.3L4 16l7.8-2.7z" fill="#fff"/>
        <circle cx="25.5" cy="6.5" r="2" fill="#fff" opacity="0.85"/>
      </svg>
    </div>
    <div class="sep"></div>
    <select id="animSelect" title="Animation"></select>
    <button id="btnNew" title="Create a new animation">New</button>
    <button id="btnDup" title="Duplicate this animation">Duplicate</button>
    <button id="btnDel" class="danger" title="Delete this animation">Delete</button>
    <div class="sep"></div>
    <button id="btnUndo" class="icon-btn" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
    </button>
    <button id="btnRedo" class="icon-btn" title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg>
    </button>
    <div class="spacer"></div>
    <button id="btnHelp" class="icon-btn" title="Take the editor tour">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 114 2c-.9.6-1.6 1.1-1.6 2.3"/><path d="M12 17.2v.01"/></svg>
    </button>
    <span id="assetStatus" class="busy"></span>
    <span id="who"></span>
    <span id="status"></span>
    <button id="btnSave" class="primary">Save <kbd>Ctrl+S</kbd></button>
  </header>

  <main>
    <aside id="settings"></aside>

    <section id="center">
      <div id="previewWrap">
        <canvas id="preview"></canvas>
        <div id="devPanel" hidden></div>
        <div id="previewHint">Drag to orbit &middot; right-drag to pan &middot; scroll to zoom &middot; approximate preview</div>
      </div>

      <div id="splitter" title="Drag to resize"></div>
      <div id="transport">
        <button id="btnPlay" class="play" title="Play / pause (Space)"></button>
        <button id="btnStop" class="icon-btn" title="Stop and rewind">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <label class="toggle" title="Loop the animation"><input type="checkbox" id="loop" checked><span>Loop</span></label>
        <label class="inline">Speed
          <select id="speed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
        </label>
        <span id="tickLabel">0 / 0</span>
        <div class="spacer"></div>
        <button id="btnItem" class="item-btn" title="Choose the preview item">Item</button>
        <label class="inline">Floor
          <select id="optFloor"><option value="studio" selected>Studio</option><option value="grass">Grass</option><option value="none">None</option></select>
        </label>
        <label class="toggle"><input type="checkbox" id="optPlayer" checked><span>Player</span></label>
        <label class="toggle"><input type="checkbox" id="optParticles" checked><span>Particles</span></label>
        <button id="btnMute" class="icon-btn" title="Toggle sound"></button>
        <button id="btnCam" class="icon-btn" title="Reset camera">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 018-8 8 8 0 016 2.7"/><path d="M18 3v4h-4"/><path d="M20 12a8 8 0 01-8 8 8 8 0 01-6-2.7"/><path d="M6 21v-4h4"/></svg>
        </button>
      </div>

      <div id="timeline"></div>
    </section>

    <aside id="inspector"></aside>
  </main>

  <div id="overlay" hidden>
    <div class="card">
      <h2 id="overlayTitle"></h2>
      <p id="overlayText"></p>
    </div>
  </div>
  <div id="toasts"></div>
  <datalist id="particleList"></datalist>
  <datalist id="soundList"></datalist>

  <script type="module" src="/app.js"></script>
</body>
</html>
